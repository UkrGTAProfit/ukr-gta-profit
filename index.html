<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ukr GTA — Прибуток зі скріншота</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#111722;border:1px solid #263142;border-radius:18px;padding:20px;margin:14px 0}
h1{margin:0 0 8px}.muted{color:#9da8b8}.file,button{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#2f9e44;color:white;font-size:17px;font-weight:700;text-align:center;cursor:pointer}
input[type=file]{display:none}.preview{width:100%;max-height:430px;object-fit:contain;margin-top:15px;border-radius:12px;display:none}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #273040}.big{font-size:28px;font-weight:800}.ok{color:#62e870}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #273040;text-align:right}th:first-child,td:first-child{text-align:left}
input[type=number]{width:100px;background:#080b10;color:white;border:1px solid #394456;border-radius:9px;padding:8px;font-size:17px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📊 Ukr GTA — прибуток зі скріншота</h1>
<p class="muted">Розпізнає рівно <b>6 прибутків</b> з правої колонки <b>«Прибуток»</b> і рахує 10% від їх загальної суми.</p>
<label class="file" for="photo">📷 Вибрати скріншот</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="preview">
<div id="status" class="muted"></div>
</div>

<div class="card">
<div class="row"><span>Знайдено прибутків</span><b id="count">0</b></div>
<table><thead><tr><th>№</th><th>Прибуток</th><th>Податок</th><th>Після податку</th></tr></thead><tbody id="results"></tbody></table>
</div>

<div class="card">
<div class="row"><span>Загальний прибуток</span><span id="gross" class="big">—</span></div>
<div class="row"><span>Загальний податок</span><span id="tax" class="big">—</span></div>
<div class="row"><span>Чистий прибуток</span><span id="net" class="big ok">—</span></div>
<div class="row"><span>Ставка податку</span><span><input id="rate" type="number" value="10" min="0" max="100" step="0.1"> %</span></div>
<br><button id="recalc">Перерахувати</button>
</div>
</div>

<script>
const photo=document.getElementById('photo'),preview=document.getElementById('preview');
const status=document.getElementById('status'),results=document.getElementById('results');
const grossEl=document.getElementById('gross'),taxEl=document.getElementById('tax'),netEl=document.getElementById('net');
const rate=document.getElementById('rate'),count=document.getElementById('count');
let profits=[];

function money(n){return Math.round(n).toLocaleString('uk-UA')+' ₴'}

function render(){
 const r=Number(rate.value||5);
 results.innerHTML='';
 let total=0,totalTax=0;
 profits.forEach((n,i)=>{
   results.innerHTML+=`<tr><td>${i+1}</td><td>${money(n)}</td><td>—</td><td>—</td></tr>`;
   total+=n;
 });
 // Податок рахується ОДИН РАЗ від загальної суми.
 totalTax=Math.round(total*r/100);
 count.textContent=profits.length;
 grossEl.textContent=profits.length?money(total):'—';
 taxEl.textContent=profits.length?money(totalTax):'—';
 netEl.textContent=profits.length?money(total-totalTax):'—';
}
rate.oninput=render;document.getElementById('recalc').onclick=render;

photo.onchange=async()=>{
 const file=photo.files[0];if(!file)return;
 preview.src=URL.createObjectURL(file);preview.style.display='block';
 status.textContent='⏳ Обрізаю праву колонку «Прибуток» і розпізнаю 6 рядків...';
 profits=[];
 try{
   const img=new Image();
   img.onload=async()=>{
     // Беремо тільки праву частину таблиці, де знаходиться колонка «Прибуток».
     const canvas=document.createElement('canvas');
     const ctx=canvas.getContext('2d');
     const cropX=Math.floor(img.width*0.57);
     const cropW=img.width-cropX;
     canvas.width=cropW;
     canvas.height=img.height;
     ctx.drawImage(img,cropX,0,cropW,img.height,0,0,cropW,img.height);

     const {data:{text}}=await Tesseract.recognize(canvas,'ukr+eng',{
       psm:6,
       logger:m=>{
         if(m.status==='recognizing text')
           status.textContent=`⏳ Розпізнавання правої колонки: ${Math.round((m.progress||0)*100)}%`;
       }
     });

     const lines=text.replace(/\u00a0/g,' ').split(/\n+/).map(x=>x.trim()).filter(Boolean);
     const candidates=[];

     for(const line of lines){
       const ns=[...line.matchAll(/\d{1,3}(?:[ .]\d{3})+|\d{6,}/g)]
         .map(m=>Number(m[0].replace(/[ .]/g,'')))
         .filter(n=>n>=100000);
       if(ns.length)candidates.push(ns[ns.length-1]);
     }

     // У цьому звіті має бути рівно 6 рядків прибутку.
     profits=[...new Set(candidates)].slice(0,6);

     // Якщо OCR зламав рядки, беремо 6 найбільш імовірних великих сум
     // саме з обрізаної правої колонки.
     if(profits.length!==6){
       const all=[...text.matchAll(/\d{1,3}(?:[ .]\d{3})+|\d{6,}/g)]
         .map(m=>Number(m[0].replace(/[ .]/g,'')))
         .filter(n=>n>=100000 && n<10000000);
       profits=[...new Set(all)].slice(0,6);
     }

     if(profits.length===6){
       status.textContent='✅ Знайдено рівно 6 прибутків з правої колонки.';
     }else{
       status.textContent=`⚠️ Знайдено ${profits.length} з 6 прибутків. Спробуй чіткіший скрін таблиці.`;
     }
     render();
   };
   img.src=URL.createObjectURL(file);
 }catch(e){
   status.textContent='❌ Помилка розпізнавання. Спробуй ще раз.';
   console.error(e);
 }
};
</script>
</body>
</html>
