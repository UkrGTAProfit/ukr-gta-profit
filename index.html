<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameMoney</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #07111f;
  color: white;
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 20px;
  padding-bottom: 80px;
}

h1 {
  text-align: center;
  margin: 15px 0 25px;
}

.card {
  background: #111f33;
  border: 1px solid #243750;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 15px;
}

.balance {
  text-align: center;
}

.balance small {
  color: #aab6c5;
}

.balance h2 {
  font-size: 38px;
  margin: 10px 0 20px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  background: #0d192a;
  border-radius: 15px;
  padding: 15px;
}

.stat small {
  color: #aab6c5;
}

.green {
  color: #42d66b;
}

.red {
  color: #ff5757;
}

input,
select,
button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #30445f;
  font-size: 16px;
}

input,
select {
  background: #0d192a;
  color: white;
}

input::placeholder {
  color: #8794a5;
}

button {
  border: none;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.photoLabel {
  display: block;
  background: #0d192a;
  border: 1px solid #30445f;
  border-radius: 12px;
  padding: 15px;
  margin-top: 10px;
  text-align: center;
  cursor: pointer;
}

#photo {
  display: none;
}

#preview {
  display: none;
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 12px;
  margin-top: 10px;
}

.operation {
  background: #111f33;
  border: 1px solid #243750;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
}

.operationTop {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.operationName {
  font-weight: bold;
}

.operationDate {
  color: #8794a5;
  font-size: 13px;
  margin-top: 5px;
}

.operation img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.delete {
  background: #401b22;
  color: #ff6868;
  margin-top: 10px;
}

.empty {
  text-align: center;
  color: #8794a5;
  padding: 25px;
}
</style>
</head>

<body>

<div class="app">

<h1>🎮 GameMoney</h1>

<div class="card balance">

  <small>Мій баланс</small>

  <h2 id="balance">0 ₴</h2>

  <div class="stats">

    <div class="stat">
      <small>Доходи</small>
      <h3 id="income" class="green">0 ₴</h3>
    </div>

    <div class="stat">
      <small>Витрати</small>
      <h3 id="expense" class="red">0 ₴</h3>
    </div>

  </div>

</div>


<div class="card">

<h3>➕ Додати операцію</h3>

<input
  id="name"
  type="text"
  placeholder="Назва операції"
>

<input
  id="amount"
  type="number"
  inputmode="decimal"
  placeholder="Сума"
>

<select id="type">
  <option value="income">💰 Дохід</option>
  <option value="expense">💸 Витрата</option>
</select>

<label class="photoLabel" for="photo">
  📸 Вибрати фото з галереї
</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

<img id="preview">

<button onclick="addOperation()">
  Додати
</button>

</div>


<h2>📋 Історія операцій</h2>

<div id="operations"></div>

</div>


<script>

let operations =
  JSON.parse(localStorage.getItem("gameMoneyOperations")) || [];

let selectedPhoto = "";


const photoInput =
  document.getElementById("photo");

const preview =
  document.getElementById("preview");


photoInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (event) {

    selectedPhoto = event.target.result;

    preview.src = selectedPhoto;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


function save() {

  localStorage.setItem(
    "gameMoneyOperations",
    JSON.stringify(operations)
  );

}


function addOperation() {

  const name =
    document.getElementById("name").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  const type =
    document.getElementById("type").value;


  if (!name) {

    alert("Введи назву операції");

    return;

  }


  if (!amount || amount <= 0) {

    alert("Введи правильну суму");

    return;

  }


  const operation = {

    id: Date.now(),

    name: name,

    amount: amount,

    type: type,

    photo: selectedPhoto,

    date: new Date().toLocaleString("uk-UA")

  };


  operations.unshift(operation);

  save();


  document.getElementById("name").value = "";

  document.getElementById("amount").value = "";

  document.getElementById("type").value = "income";

  document.getElementById("photo").value = "";

  selectedPhoto = "";

  preview.src = "";

  preview.style.display = "none";


  render();

}


function deleteOperation(id) {

  if (!confirm("Видалити цю операцію?")) {
    return;
  }


  operations =
    operations.filter(item => item.id !== id);


  save();

  render();

}


function money(value) {

  return value.toLocaleString("uk-UA") + " ₴";

}


function render() {

  let income = 0;

  let expense = 0;


  operations.forEach(item => {

    if (item.type === "income") {

      income += item.amount;

    } else {

      expense += item.amount;

    }

  });


  const balance =
    income - expense;


  document.getElementById("balance").textContent =
    money(balance);

  document.getElementById("income").textContent =
    money(income);

  document.getElementById("expense").textContent =
    money(expense);


  const container =
    document.getElementById("operations");


  if (operations.length === 0) {

    container.innerHTML =
      '<div class="empty">Операцій поки немає</div>';

    return;

  }


  container.innerHTML = "";


  operations.forEach(item => {

    const div =
      document.createElement("div");


    div.className = "operation";


    const sign =
      item.type === "income" ? "+" : "-";


    const color =
      item.type === "income" ? "green" : "red";


    div.innerHTML = `

      <div class="operationTop">

        <div>

          <div class="operationName">
            ${escapeHTML(item.name)}
          </div>

          <div class="operationDate">
            ${item.date}
          </div>

        </div>

        <strong class="${color}">
          ${sign}${money(item.amount)}
        </strong>

      </div>

      ${
        item.photo
          ? `<img src="${item.photo}" alt="Фото операції">`
          : ""
      }

      <button
        class="delete"
        onclick="deleteOperation(${item.id})"
      >
        🗑️ Видалити
      </button>

    `;


    container.appendChild(div);

  });

}


function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


render();

</script>

</body>
</html>
