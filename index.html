<div class="taxbox" style="margin-top:10px">
  <div style="font-weight:800;margin-bottom:8px">📷 Фото податку</div>

  <label class="secondary" style="display:block;text-align:center;cursor:pointer">
    📷 Вибрати фото з галереї
    <input
      id="taxPhoto"
      type="file"
      accept="image/*"
      hidden
    >
  </label>

  <div id="photoPreview" style="margin-top:10px"></div>

  <button
    class="secondary"
    style="margin-top:10px;width:100%"
    onclick="removeTaxPhoto()"
  >
    🗑 Видалити фото
  </button>
</div>
