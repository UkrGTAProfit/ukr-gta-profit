<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.json">
<title>Ukr GTA — Чистий дохід</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc}
.wrap{max-width:700px;margin:auto;padding:20px 16px 40px}.title{font-size:28px;font-weight:800;margin:10px 0 4px}.sub{color:#94a3b8;margin-bottom:18px}
.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:6px}input,select{width:100%;padding:13px;border:1px solid #475569;border-radius:12px;background:#0f172a;color:white;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#22c55e;color:#052e16;font-weight:800;font-size:16px;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:14px;border-radius:14px;background:#0f172a}.num{font-size:20px;font-weight:800;margin-top:5px}.green{color:#4ade80}.red{color:#fb7185}.blue{color:#60a5fa}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #334155}.item:last-child{border:0}.small{font-size:13px;color:#94a3b8}.delete{width:auto;margin:0;padding:7px 10px;background:#334155;color:#f8fafc;font-weight:600}
.empty{text-align:center;color:#94a3b8;padding:20px}.danger{background:#ef4444;color:white}
@media(max-width:480px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="title">🚛 Ukr GTA — Чистий дохід</div>
<div class="sub">Рахуй прибуток від бізнесу, роботи та транспорту</div>
<div class="card"><div class="stats">
<div class="stat"><div class="small">Доходи</div><div id="income" class="num green">0 $</div></div>
<div class="stat"><div class="small">Витрати</div><div id="expense" class="num red">0 $</div></div>
<div class="stat"><div class="small">Чистий дохід</div><div id="profit" class="num blue">0 $</div></div>
</div></div>
<div class="card">
<div class="grid">
<div><label>Тип операції</label><select id="type"><option value="income">Дохід</option><option value="expense">Витрата</option></select></div>
<div><label>Сума ($)</label><input id="amount" type="number" min="0" placeholder="150000"></div>
</div>
<div style="margin-top:10px"><label>Назва</label><input id="name" placeholder="Напр. Доставка"></div>
<button onclick="add()">Додати операцію</button>
</div>
<div class="card"><button onclick="clearAll()" class="danger">Очистити все</button></div>
<div class="card"><h3 style="margin-top:0">📋 Історія</h3><div id="list"></div></div>
</div>
<script>
const KEY="ukr-gta-profit-v1";let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const money=n=>new Intl.NumberFormat("uk-UA").format(n)+" $";
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function add(){const type=document.getElementById("type").value,amount=Number(document.getElementById("amount").value),name=document.getElementById("name").value.trim()||(type==="income"?"Дохід":"Витрата");if(!amount||amount<0)return alert("Введи суму");data.unshift({id:Date.now(),type,amount,name,date:new Date().toLocaleString("uk-UA")});document.getElementById("amount").value="";document.getElementById("name").value="";save()}
function del(id){data=data.filter(x=>x.id!==id);save()}
function clearAll(){if(confirm("Видалити всю історію?")){data=[];save()}}
function render(){let inc=data.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0),exp=data.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0);document.getElementById("income").textContent=money(inc);document.getElementById("expense").textContent=money(exp);document.getElementById("profit").textContent=money(inc-exp);document.getElementById("list").innerHTML=data.length?data.map(x=>`<div class="item"><div><b>${escapeHtml(x.name)}</b><div class="small">${x.date}</div></div><div style="text-align:right"><b class="${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"}${money(x.amount)}</b><br><button class="delete" onclick="del(${x.id})">Видалити</button></div></div>`).join(""):'<div class="empty">Операцій ще немає</div>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
