<div class="auth-box">

    <h2>🔐 MTA HUB</h2>
    <p>Вхід або реєстрація</p>

    <div id="phoneStep">

        <input
            id="phone"
            type="tel"
            placeholder="+380XXXXXXXXX"
        >

        <button onclick="sendCode()">
            Отримати код
        </button>

    </div>

    <div id="codeStep" style="display:none;">

        <input
            id="code"
            type="text"
            maxlength="6"
            placeholder="Введи SMS-код"
        >

        <button onclick="verifyCode()">
            Увійти
        </button>

    </div>

    <p id="message"></p>

</div>

<style>

.auth-box {
    width: 360px;
    max-width: 90%;
    margin: 100px auto;
    padding: 30px;
    background: #101520;
    border: 1px solid #263149;
    border-radius: 18px;
    text-align: center;
    color: white;
}

.auth-box h2 {
    margin-bottom: 10px;
}

.auth-box p {
    color: #8e99ac;
    margin-bottom: 20px;
}

.auth-box input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #303b52;
    background: #080b12;
    color: white;
    outline: none;
}

.auth-box button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #4da3ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.auth-box button:hover {
    opacity: .85;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "ВСТАВ_ТУТ_PROJECT_URL";

const SUPABASE_KEY = "ВСТАВ_ТУТ_PUBLISHABLE_KEY";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function sendCode() {

    const phone =
        document.getElementById("phone").value.trim();

    const message =
        document.getElementById("message");

    if (!phone) {
        message.innerText =
            "Введи номер телефону";
        return;
    }

    message.innerText =
        "Надсилаємо код...";

    const { error } =
        await supabaseClient.auth.signInWithOtp({
            phone: phone
        });

    if (error) {

        message.innerText =
            "Помилка: " + error.message;

        return;
    }

    document.getElementById("phoneStep")
        .style.display = "none";

    document.getElementById("codeStep")
        .style.display = "block";

    message.innerText =
        "SMS-код надіслано 📱";
}


async function verifyCode() {

    const phone =
        document.getElementById("phone").value.trim();

    const code =
        document.getElementById("code").value.trim();

    const message =
        document.getElementById("message");

    if (!code) {

        message.innerText =
            "Введи код із SMS";

        return;
    }

    const { data, error } =
        await supabaseClient.auth.verifyOtp({
            phone: phone,
            token: code,
            type: "sms"
        });

    if (error) {

        message.innerText =
            "Невірний код";

        return;
    }

    message.innerText =
        "✅ Успішний вхід!";

    setTimeout(() => {

        window.location.href =
            "profile.html";

    }, 1000);
}

</script>
