<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f"><link rel="manifest" href="manifest.json">
<title>Ukr GTA Profit 10.1</title>
<style>
:root{--bg:#05070b;--panel:#0c1118;--panel2:#111923;--line:#1f2b38;--text:#f7f9fc;--muted:#8290a3;--blue:#4d8dff;--blue2:#7aaaff;--green:#34df91;--red:#ff5e70;--gold:#f7c75a;--shadow:0 18px 55px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#152744 0,#080b11 34%,#05070b 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
.app{max-width:920px;margin:auto;padding:18px 16px 100px}.title{font-size:31px;letter-spacing:-.7px;font-weight:900}.title span{background:linear-gradient(90deg,#6aa0ff,#b6d0ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--muted);margin:5px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:linear-gradient(145deg,rgba(18,27,38,.96),rgba(9,14,20,.96));border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.wide{grid-column:1/-1}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}.num{font-size:25px;font-weight:900;margin-top:7px;letter-spacing:-.4px}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}
.tabs{display:flex;gap:8px;margin:16px 0}.tab{flex:1;padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(15,22,31,.9);color:var(--text);font-weight:850;box-shadow:0 8px 25px rgba(0,0,0,.2)}.active{background:linear-gradient(135deg,#4d8dff,#316de0);border-color:#669dff;box-shadow:0 10px 30px rgba(55,119,255,.25)}
.row{display:flex;gap:9px;margin:10px 0}.row>*{flex:1;min-width:0}input,select{width:100%;padding:14px;border:1px solid #263442;border-radius:14px;background:#080d13;color:var(--text);font-size:16px;outline:none}input:focus,select:focus{border-color:#4d8dff;box-shadow:0 0 0 3px rgba(77,141,255,.12)}
.primary,.secondary{border:0;border-radius:14px;font-weight:850}.primary{width:100%;padding:15px;background:linear-gradient(135deg,#5a97ff,#326fe5);color:#fff;box-shadow:0 10px 25px rgba(60,120,255,.2)}.secondary{padding:12px;background:#17222e;color:#f3f6fb}
.section{margin-top:18px}h2{font-size:19px;letter-spacing:-.2px;margin:0 0 11px}.statline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.statline:last-child{border:0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:rgba(12,18,25,.9);border:1px solid var(--line);border-radius:16px;padding:13px;margin:8px 0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:900;white-space:nowrap}.x{background:transparent;color:#667487;border:0;font-size:22px;padding:4px}
.goalbar{height:12px;background:#080d13;border-radius:20px;overflow:hidden;border:1px solid var(--line)}.goalfill{height:100%;background:linear-gradient(90deg,#28cf82,#6df0ad);width:0;box-shadow:0 0 18px rgba(52,223,145,.4)}.taxbox{background:#080d13;border:1px solid var(--line);border-radius:16px;padding:13px}canvas{width:100%;height:220px;background:#080d13;border:1px solid var(--line);border-radius:16px}.empty{text-align:center;color:var(--muted);padding:25px}.footer{text-align:center;color:#657286;font-size:12px;margin-top:26px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.wide{grid-column:span 2}}@media(max-width:520px){.actions{grid-template-columns:1fr}.row{flex-direction:column}}
</style></head>
<body><div class="app">
<div class="title">💎 Ukr GTA Profit <span>10.3 PREMIUM</span></div>
<div class="sub">Преміум панель фінансів для Ukr GTA</div>

<div class="grid">
<div class="card"><div class="label">Доходи</div><div id="inc" class="num green">0 ₴</div></div>
<div class="card"><div class="label">Витрати</div><div id="exp" class="num red">0 ₴</div></div>
<div class="card"><div class="label">Податок</div><div id="taxTotal" class="num red">0 ₴</div></div>
<div class="card"><div class="label">Чистий прибуток</div><div id="profit" class="num gold">0 ₴</div></div>
</div>

<div class="tabs"><button id="it" class="tab active" onclick="setType('income')">➕ Дохід</button><button id="et" class="tab" onclick="setType('expense')">➖ Витрата</button></div>
<div class="card"><h2 id="formTitle">Додати дохід</h2>
<div class="row"><input id="amount" type="number" inputmode="decimal" min="0" placeholder="Сума, ₴"><select id="cat"></select></div>
<div class="row"><input id="note" placeholder="Назва операції"><input id="hours" type="number" min="0" step=".1" placeholder="Годин"></div>
<button class="primary" onclick="add()">Додати операцію</button></div>

<div class="section card"><h2>🧾 Податки</h2>
<div class="row"><input id="taxRate" type="number" min="0" max="100" step=".1" placeholder="Ставка, %"><button class="secondary" onclick="saveTax()">Зберегти ставку</button></div>
<div id="taxInfo" class="taxbox"></div>
<div class="row"><button class="secondary" onclick="addTaxAsExpense()">Додати податок як витрату</button></div>
<div class="taxbox" style="margin-top:10px">
  <div style="font-weight:800;margin-bottom:8px">📷 Фото податку</div>
  <input id="taxPhoto" type="file" accept="image/*" capture="environment">
  <div id="photoPreview" style="margin-top:10px"></div>
  <button class="secondary" style="margin-top:10px;width:100%" onclick="removeTaxPhoto()">Видалити фото</button>
</div>
</div>

<div class="section card"><h2>🎯 Ціль</h2>
<div class="row"><input id="goal" type="number" min="0" placeholder="Ціль, ₴"><button class="secondary" onclick="saveGoal()">Зберегти</button></div>
<div id="goalInfo"></div><div class="goalbar"><div id="goalFill" class="goalfill"></div></div></div>

<div class="section card"><h2>📊 Статистика</h2>
<div class="row"><select id="period" onchange="render()"><option value="all">Весь час</option><option value="today">Сьогодні</option><option value="week">7 днів</option><option value="month">30 днів</option></select><select id="categoryFilter" onchange="render()"><option value="all">Всі категорії</option></select></div>
<div id="summary"></div><canvas id="chart" width="820" height="220" style="width:100%;background:#0b1118;border:1px solid #273442;border-radius:14px"></canvas></div>

<div class="section"><h2>📋 Історія</h2><div class="actions"><button class="secondary" onclick="exportData()">📤 Експорт</button><button class="secondary" onclick="document.getElementById('file').click()">📥 Імпорт</button><button class="secondary" onclick="clearAll()">🗑 Очистити</button></div>
<input id="file" type="file" accept=".json" hidden><div id="list"></div></div>

<div class="section card">
<h2>📁 Мої документи</h2>
<div class="sub" style="margin-bottom:10px">Локальні нотатки та фото. Не підключено до державних реєстрів.</div>
<div class="row"><input id="docName" placeholder="Назва документа"><input id="docNote" placeholder="Нотатка"></div>
<div class="row"><input id="docPhoto" type="file" accept="image/*" capture="environment"></div>
<button class="primary" onclick="addDoc()">Додати документ</button>
<div id="docsList" style="margin-top:10px"></div>
</div>
<div class="footer">Ukr GTA Profit 10.1</div></div>

<script>
const KEY='ukr-gta-profit-10.1';let data=JSON.parse(localStorage.getItem(KEY)||'[]'),type='income',taxRate=Number(localStorage.getItem('taxRate')||5),goalValue=Number(localStorage.getItem('gtaGoal')||0);
const cats={income:['Робота','Транспорт','Бізнес','Продаж','Ферма','Місії','Інше'],expense:['Пальне','Ремонт','Оренда','Покупка','Податки','Штрафи','Інше']};
const money=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2}).format(n)+' ₴';
function setType(t){type=t;it.classList.toggle('active',t==='income');et.classList.toggle('active',t==='expense');formTitle.textContent=t==='income'?'Додати дохід':'Додати витрату';cat.innerHTML=cats[t].map(x=>'<option>'+x+'</option>').join('')}
function add(){let a=Number(amount.value),h=Number(hours.value)||0;if(a<=0){alert('Введи суму');return}data.unshift({id:Date.now(),type,amount:a,cat:cat.value,note:note.value.trim()||cat.value,hours:h,date:Date.now()});save();amount.value='';hours.value='';note.value='';render()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function filtered(){let p=period.value,n=Date.now(),ms=p==='today'?864e5:p==='week'?6048e5:p==='month'?2592e6:Infinity,d=data.filter(x=>n-x.date<ms),cf=categoryFilter.value;return cf==='all'?d:d.filter(x=>x.cat===cf)}
function calc(d){let income=d.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),expense=d.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),tax=income*taxRate/100;return {income,expense,tax,profit:income-expense-tax,hours:d.reduce((s,x)=>s+x.hours,0)}}
function render(){let d=filtered(),c=calc(d);inc.textContent=money(c.income);exp.textContent=money(c.expense);taxTotal.textContent=money(c.tax);profit.textContent=money(c.profit);taxRate.value=taxRate;goal.value=goalValue||'';let pct=goalValue?Math.max(0,Math.min(100,c.profit/goalValue*100)):0;goalFill.style.width=pct+'%';goalInfo.innerHTML=goalValue?'<div class="statline"><span>Ціль</span><b>'+money(goalValue)+'</b></div><div class="statline"><span>Виконано</span><b>'+pct.toFixed(1)+'%</b></div><div class="statline"><span>Залишилось</span><b>'+money(Math.max(0,goalValue-c.profit))+'</b></div>':'';taxInfo.innerHTML='<div class="statline"><span>Ставка</span><b>'+taxRate.toFixed(1)+'%</b></div><div class="statline"><span>Дохід до податку</span><b>'+money(c.income)+'</b></div><div class="statline"><span>Податок</span><b class="red">'+money(c.tax)+'</b></div><div class="statline"><span>Після податку</span><b class="green">'+money(c.income-c.tax)+'</b></div>';summary.innerHTML='<div class="statline"><span>Операцій</span><b>'+d.length+'</b></div><div class="statline"><span>Годин</span><b>'+c.hours.toFixed(1)+'</b></div><div class="statline"><span>Прибуток / год</span><b>'+money(c.hours?c.profit/c.hours:0)+'</b></div>';let all=[...new Set(data.map(x=>x.cat))];categoryFilter.innerHTML='<option value="all">Всі категорії</option>'+all.map(x=>'<option>'+esc(x)+'</option>').join('');draw(d);list.innerHTML=d.length?d.map(x=>'<div class="item"><div><b>'+esc(x.note)+'</b><div class="meta">'+esc(x.cat)+' • '+new Date(x.date).toLocaleString('uk-UA')+(x.hours?' • '+x.hours+' год':'')+'</div></div><div class="amount '+(x.type==='income'?'green':'red')+'">'+(x.type==='income'?'+':'−')+money(x.amount)+'</div><button class="x" onclick="del('+x.id+')">×</button></div>').join(''):'<div class="empty">Немає операцій.</div>'}
function showTaxPhoto(){
 const p=localStorage.getItem('gtaTaxPhoto');
 photoPreview.innerHTML=p?'<img src="'+p+'" style="width:100%;max-height:280px;object-fit:contain;border-radius:12px;border:1px solid #273442">':'<div style="color:#8d99aa">Фото ще не додано</div>';
}
taxPhoto.onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 if(!f.type.startsWith('image/')) return alert('Вибери фото');
 const r=new FileReader(); r.onload=()=>{localStorage.setItem('gtaTaxPhoto',r.result);showTaxPhoto()}; r.readAsDataURL(f);
};
function removeTaxPhoto(){localStorage.removeItem('gtaTaxPhoto');taxPhoto.value='';showTaxPhoto()}
function saveTax(){taxRate=Math.max(0,Math.min(100,Number(document.getElementById('taxRate').value)||0));localStorage.setItem('taxRate',taxRate);render()}
function addTaxAsExpense(){let d=filtered(),t=calc(d).tax;if(t<=0)return alert('Податок зараз дорівнює 0');data.unshift({id:Date.now(),type:'expense',amount:t,cat:'Податки',note:'Податок '+taxRate+'%',hours:0,date:Date.now()});save();render()}
function saveGoal(){goalValue=Number(goal.value)||0;localStorage.setItem('gtaGoal',goalValue);render()}
function del(id){data=data.filter(x=>x.id!==id);save();render()}
function clearAll(){if(confirm('Видалити всю історію?')){data=[];save();render()}}
function exportData(){let b=new Blob([JSON.stringify({version:'10.1',taxRate,goal:goalValue,data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ukr-gta-profit-backup.json';a.click()}
file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);data=Array.isArray(x)?x:x.data||[];if(x.taxRate!==undefined)taxRate=Number(x.taxRate);if(x.goal!==undefined)goalValue=Number(x.goal);save();localStorage.setItem('taxRate',taxRate);localStorage.setItem('gtaGoal',goalValue);render();alert('Дані імпортовано')}catch{alert('Невірний файл')}};r.readAsText(f)}
function draw(d){let c=chart,ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let v=[];for(let k=6;k>=0;k--){let day=new Date();day.setHours(0,0,0,0);day.setDate(day.getDate()-k);let a=day.getTime(),b=a+864e5,ii=d.filter(x=>x.type==='income'&&x.date>=a&&x.date<b).reduce((s,x)=>s+x.amount,0),ee=d.filter(x=>x.type==='expense'&&x.date>=a&&x.date<b).reduce((s,x)=>s+x.amount,0);v.push({ii,ee,l:day.getDate()+'.'+(day.getMonth()+1)})}let m=Math.max(1,...v.flatMap(x=>[x.ii,x.ee]));v.forEach((x,j)=>{let xx=40+j*(w-65)/7,ih=x.ii/m*145,eh=x.ee/m*145;ctx.fillStyle='#35d98b';ctx.fillRect(xx,h-35-ih,24,ih);ctx.fillStyle='#ff6070';ctx.fillRect(xx+28,h-35-eh,24,eh);ctx.fillStyle='#8d99aa';ctx.font='12px Arial';ctx.fillText(x.l,xx,h-12)})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
setType('income');showTaxPhoto();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

const DOC_KEY='ukr-gta-documents';
let docs=JSON.parse(localStorage.getItem(DOC_KEY)||'[]');
function addDoc(){
 const name=document.getElementById('docName').value.trim();
 const note=document.getElementById('docNote').value.trim();
 const file=document.getElementById('docPhoto').files[0];
 if(!name && !file){alert('Вкажи назву або додай фото');return}
 const finish=(photo='')=>{
  docs.unshift({id:Date.now(),name:name||'Документ',note,photo,date:new Date().toLocaleString('uk-UA')});
  localStorage.setItem(DOC_KEY,JSON.stringify(docs));
  document.getElementById('docName').value='';document.getElementById('docNote').value='';document.getElementById('docPhoto').value='';
  renderDocs();
 };
 if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish();
}
function delDoc(id){docs=docs.filter(x=>x.id!==id);localStorage.setItem(DOC_KEY,JSON.stringify(docs));renderDocs()}
function renderDocs(){
 const el=document.getElementById('docsList');
 el.innerHTML=docs.length?docs.map(d=>`<div class="item"><div><div class="name">${esc(d.name)}</div><div class="meta">${esc(d.note)} ${d.date?'• '+d.date:''}</div>${d.photo?`<img src="${d.photo}" style="max-width:100%;max-height:180px;margin-top:8px;border-radius:12px;border:1px solid #273442">`:''}</div><button class="x" onclick="delDoc(${d.id})">×</button></div>`).join(''):'<div class="empty">Документів ще немає.</div>';
}
renderDocs();
</script></body></html>
