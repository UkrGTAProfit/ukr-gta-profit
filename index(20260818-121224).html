<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a0f"><title>Ukr GTA Profit 10.4 PREMIUM</title><style>body{margin:0;background:#070a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:900px;margin:auto;padding:20px}.card{background:#101721;border:1px solid #263442;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1}input,select,button{padding:14px;border-radius:12px;border:1px solid #263442;font-size:16px}input,select{background:#080d13;color:#fff}button{background:#2f72e5;color:#fff;font-weight:800}.green{color:#34df91}.red{color:#ff5e70}.preview img{max-width:100%;max-height:280px;margin-top:10px;border-radius:12px}.item{padding:12px;border:1px solid #263442;border-radius:12px;margin:8px 0}</style></head><body><div class="app"><h1>💎 Ukr GTA Profit <span class="green">10.4 PREMIUM</span></h1><p>Калькулятор доходів, витрат і податків</p><div class="card"><h2>💰 Операція</h2><div class="row"><input id="amount" type="number" placeholder="Сума, ₴"><select id="type"><option value="income">Дохід</option><option value="expense">Витрата</option></select></div><input id="note" placeholder="Назва операції" style="width:100%;box-sizing:border-box"><button onclick="add()" style="width:100%;margin-top:10px">Додати</button></div><div class="card"><h2>🧾 Податок</h2><div class="row"><input id="tax" type="number" value="5" placeholder="Ставка %"></div><p>Податок: <b id="taxSum">0 ₴</b></p><h3>📷 Фото податку</h3><p>Вибери фото прямо з галереї iPhone:</p><input id="taxPhoto" type="file" accept="image/*"><div id="taxPreview" class="preview"></div><button onclick="removeTaxPhoto()" style="margin-top:10px">Видалити фото</button></div><div class="card"><h2>📁 Мої документи</h2><input id="docName" placeholder="Назва документа" style="width:100%;box-sizing:border-box"><p><input id="docPhoto" type="file" accept="image/*"></p><button onclick="addDoc()">Додати документ</button><div id="docs"></div></div><div class="card"><h2>📋 Історія</h2><div id="history"></div></div></div><script>let data=JSON.parse(localStorage.getItem("gtaData")||"[]");let docs=JSON.parse(localStorage.getItem("gtaDocs")||"[]");const money=n=>new Intl.NumberFormat("uk-UA").format(n)+" ₴";function render(){let inc=data.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0),exp=data.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0),t=inc*(Number(tax.value)||0)/100;taxSum.textContent=money(t);history.innerHTML=data.length?data.map((x,i)=>`<div class="item"><b>${x.type==="income"?"➕":"➖"} ${money(x.amount)}</b> — ${x.note}<button onclick="del(${i})" style="float:right;padding:6px">×</button></div>`).join(""):"Немає операцій.";docsEl();}function add(){let a=Number(amount.value);if(!a)return alert("Введи суму");data.unshift({amount:a,type:type.value,note:note.value||"Операція"});localStorage.setItem("gtaData",JSON.stringify(data));amount.value="";note.value="";render()}function del(i){data.splice(i,1);localStorage.setItem("gtaData",JSON.stringify(data));render()}tax.oninput=render;function showTaxPhoto(){let p=localStorage.getItem("gtaTaxPhoto");taxPreview.innerHTML=p?`<img src="${p}">`:""}taxPhoto.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{localStorage.setItem("gtaTaxPhoto",r.result);showTaxPhoto()};r.readAsDataURL(f)};function removeTaxPhoto(){localStorage.removeItem("gtaTaxPhoto");taxPhoto.value="";showTaxPhoto()}function addDoc(){let f=docPhoto.files[0],n=docName.value||"Документ";if(!f)return alert("Вибери фото");let r=new FileReader();r.onload=()=>{docs.unshift({name:n,photo:r.result});localStorage.setItem("gtaDocs",JSON.stringify(docs));docName.value="";docPhoto.value="";docsEl()};r.readAsDataURL(f)}function docsEl(){docs.innerHTML="";let el=document.getElementById("docs");el.innerHTML=docs.map((d,i)=>`<div class="item"><b>${d.name}</b><br><img src="${d.photo}" style="max-width:100%;max-height:200px;margin-top:8px;border-radius:10px"><br><button onclick="docs.splice(${i},1);localStorage.setItem("gtaDocs",JSON.stringify(docs));docsEl()">Видалити</button></div>`).join("")}showTaxPhoto();render();</script></body></html>
