<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ukr GTA — 6 прибутків</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:820px;margin:auto;padding:20px}.card{background:#111722;border:1px solid #263142;border-radius:18px;padding:18px;margin:14px 0}
h1{margin:0 0 8px}.muted{color:#9da8b8}.file,button{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#2f9e44;color:#fff;font-size:17px;font-weight:700;text-align:center;cursor:pointer}
input[type=file]{display:none}.preview{width:100%;max-height:500px;object-fit:contain;margin-top:14px;border-radius:12px;display:none}
.grid{display:grid;grid-template-columns:50px 1fr;gap:8px 10px;align-items:center}.num{width:100%;background:#080b10;color:#fff;border:1px solid #394456;border-radius:9px;padding:11px;font-size:18px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #273040}.big{font-size:28px;font-weight:800}.ok{color:#62e870}.warn{color:#ffd166}
button.secondary{background:#263142;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📊 Ukr GTA — 6 прибутків</h1>
<p class="muted">Завантажуй <b>оригінальний скріншот з гри</b>. Програма бере тільки 6 сум із колонки «Прибуток».</p>
<label class="file" for="photo">📷 Вибрати скріншот</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="preview">
<div id="status" class="muted"></div>
</div>

<div class="card">
<h3>6 прибутків</h3>
<div id="fields" class="grid"></div>
<button id="ocrAgain" class="secondary">🔄 Розпізнати ще раз</button>
</div>

<div class="card">
<div class="row"><span>Разом</span><span id="gross" class="big">—</span></div>
<div class="row"><span>Податок 10%</span><span id="tax" class="big warn">—</span></div>
<div class="row"><span>Чистими 90%</span><span id="net" class="big ok">—</span></div>
</div>
</div>

<script>
const photo=document.getElementById('photo'), preview=document.getElementById('preview');
const status=document.getElementById('status'), fields=document.getElementById('fields');
const gross=document.getElementById('gross'),tax=document.getElementById('tax'),net=document.getElementById('net');
let lastFile=null;

function money(n){return Math.round(n).toLocaleString('uk-UA')+' ₴'}
function parseVal(v){return Number(String(v).replace(/[^\d]/g,''))||0}

function makeFields(values=[]){
 fields.innerHTML='';
 for(let i=0;i<6;i++){
   fields.innerHTML+=`<span>${i+1}.</span><input class="num profit" inputmode="numeric" placeholder="сума прибутку" value="${values[i]||''}">`;
 }
 document.querySelectorAll('.profit').forEach(x=>x.addEventListener('input',calc));
 calc();
}
function calc(){
 const vals=[...document.querySelectorAll('.profit')].map(x=>parseVal(x.value)).filter(Boolean);
 const total=vals.reduce((a,b)=>a+b,0), t=Math.round(total*.10), n=total-t;
 gross.textContent=total?money(total):'—';tax.textContent=total?money(t):'—';net.textContent=total?money(n):'—';
}
makeFields();

async function recognize(file){
 preview.src=URL.createObjectURL(file);preview.style.display='block';
 status.textContent='⏳ Розпізнаю праву колонку...';

 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=URL.createObjectURL(file)});

 // У таблиці Ukr GTA прибуток знаходиться у правій частині.
 // Обрізаємо саме праву ~43% і збільшуємо у 2.5 раза.
 const canvas=document.createElement('canvas');
 const x=Math.floor(img.width*.57);
 const w=img.width-x;
 canvas.width=w*3; canvas.height=img.height*3;
 const c=canvas.getContext('2d');
 c.imageSmoothingEnabled=false;
 c.drawImage(img,x,0,w,img.height,0,0,w*3,img.height*3);

 const out=await Tesseract.recognize(canvas,'ukr+eng',{
   logger:m=>{if(m.status==='recognizing text')status.textContent=`⏳ OCR: ${Math.round((m.progress||0)*100)}%`}
 });

 // Використовуємо координати OCR: беремо числові слова праворуч,
 // групуємо за приблизним Y і залишаємо 6 рядків таблиці.
 const data=out.data;
 const rows=[];
 for(let i=0;i<data.words.length;i++){
   const z=data.words[i];
   const txt=z.text.replace(/[^\d]/g,'');
   const val=Number(txt);
   if(!val || val<100000 || val>99999999) continue;
   const cy=(z.bbox.y0+z.bbox.y1)/2;
   let row=rows.find(r=>Math.abs(r.cy-cy)<35);
   if(!row){row={cy,items:[]};rows.push(row)}
   row.items.push({val,x:z.bbox.x0});
 }
 rows.sort((a,b)=>a.cy-b.cy);

 let vals=rows.map(r=>{
   r.items.sort((a,b)=>b.x-a.x);
   return r.items[0].val;
 }).filter(v=>v>=100000);

 // При нормальному оригінальному скріншоті має бути рівно 6.
 // Якщо OCR розбив число на частини — використовуємо рядковий regex.
 if(vals.length!==6){
   const lines=out.data.text.split(/\n+/);
   vals=[];
   for(const line of lines){
     const ns=[...line.matchAll(/\d{1,3}(?:[ .]\d{3})+|\d{6,}/g)]
       .map(m=>Number(m[0].replace(/[ .]/g,''))).filter(v=>v>=100000&&v<=99999999);
     if(ns.length) vals.push(ns[ns.length-1]);
   }
 }
 vals=[...new Set(vals)].slice(0,6);

 if(vals.length===6){
   makeFields(vals);
   status.innerHTML='✅ Знайдено <b>6 прибутків</b>. Перевір цифри перед розрахунком.';
 }else{
   makeFields(vals);
   status.innerHTML=`⚠️ OCR знайшов ${vals.length} з 6. <b>Можеш виправити цифри вручну</b> у полях нижче.`;
 }
 calc();
}
photo.onchange=()=>{lastFile=photo.files[0];if(lastFile)recognize(lastFile)};
document.getElementById('ocrAgain').onclick=()=>{if(lastFile)recognize(lastFile);};
</script>
</body>
</html>
